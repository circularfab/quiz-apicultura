<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking</title>
<style>
  :root{ --miel:#f6b81a; --miel-osc:#c98a00; --fondo:#1d1608; --panel:#2b2110; --texto:#fff6dd; --gris:#c9b78f; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  body{background-image:
      radial-gradient(circle at 0% 0%,rgba(246,184,26,.18) 0,transparent 40%),
      radial-gradient(circle at 100% 100%,rgba(246,184,26,.12) 0,transparent 40%)}
  .wrap{display:grid;grid-template-columns:1fr 30vw;gap:3vw;height:100%;padding:3.5vh 3vw}
  h1{font-size:4.4vh;margin:0;color:var(--miel)}
  .sub{font-size:2.4vh;color:var(--gris);margin:.6vh 0 2.5vh}
  table{width:100%;border-collapse:separate;border-spacing:0 1vh}
  td{padding:1.4vh 1.6vw;font-size:3.3vh;background:var(--panel)}
  td:first-child{border-radius:1.2vh 0 0 1.2vh;width:9vh;text-align:center;font-weight:900}
  td:last-child{border-radius:0 1.2vh 1.2vh 0;text-align:right;font-weight:800;color:var(--miel)}
  td.nombre{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
  td.det{font-size:2.3vh;color:var(--gris);text-align:right;white-space:nowrap}
  tr.p1 td{background:linear-gradient(90deg,#5a4510,#3a2c0c)}
  tr.nuevo td{animation:brillo 2.5s ease-out}
  @keyframes brillo{0%{background:#8a6a10}100%{}}
  .vacio{font-size:3vh;color:var(--gris);margin-top:6vh}
  .lado{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .qr{background:#fff;padding:1.6vh;border-radius:2vh;width:26vw;max-width:46vh}
  .qr img{width:100%;display:block}
  .cta{font-size:3.6vh;font-weight:800;margin:2.5vh 0 1vh;color:var(--miel)}
  .stats{font-size:2.6vh;color:var(--gris);margin-top:2vh}
  .stats b{color:var(--texto);font-size:4vh;display:block}
  .pie{font-size:1.7vh;color:#7d6c4b;margin-top:2vh}
  .login{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
  .login form{max-width:420px;width:100%}
  .login input{width:100%;font-size:20px;padding:12px;border-radius:10px;border:2px solid var(--miel);background:#fff;color:#2b2112;margin-top:8px}
  .login button{width:100%;margin-top:12px;font-size:20px;font-weight:800;padding:12px;border:0;border-radius:10px;background:var(--miel);color:#2b2112;cursor:pointer}
  .errLogin{color:#ff8a7a;margin-top:10px;min-height:1.2em}
  .login h1{font-size:28px} .login .sub{font-size:16px}
</style>
</head>
<body>
<div id="login" class="login oculto">
  <form id="fLogin">
    <div style="font-size:5vh">🔒</div>
    <h1>Ranking privado</h1>
    <p class="sub">Introduce la clave de administrador</p>
    <input id="clave" type="password" autocomplete="current-password">
    <button type="submit">Entrar</button>
    <div id="errLogin" class="errLogin"></div>
  </form>
</div>
<div class="wrap oculto" id="panel">
  <main>
    <h1 id="titulo"></h1>
    <div class="sub" id="subtitulo"></div>
    <table><tbody id="filas"></tbody></table>
    <div class="vacio oculto" id="vacio">Aún no hay puntuaciones. ¡Sé el primero! 🐝</div>
  </main>
  <aside class="lado">
    <div class="qr"><img id="qr" alt="Código QR para jugar"></div>
    <div class="cta">📱 ¡Escanea y juega!</div>
    <div class="stats"><b id="jugadores">0</b>personas han jugado</div>
    <div class="pie">Actualizado <span id="hora">—</span></div>
  </aside>
</div>

<script src="config.js"></script>
<script>
const medallas = ['🥇','🥈','🥉'];
const CLAVE_LS = 'quizFeria_claveAdmin';
let anteriores = new Set();
let CFG = { titulo: 'Ranking', subtitulo: '', top: 10, refresco: 10 };
let clave = '', codigoQR = null, intervalo = null;
const $ = id => document.getElementById(id);

// La clave puede venir en la URL como …/ranking.html#clave=XXXX
// (lo que va detrás de # no se envía a GitHub ni queda en sus registros)
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('clave')) {
  clave = hash.get('clave');
  history.replaceState(null, '', location.pathname); // la quitamos de la barra de direcciones
} else {
  try { clave = localStorage.getItem(CLAVE_LS) || ''; } catch (e) {}
}

function pintarCabecera(){
  document.title = 'Ranking · ' + CFG.titulo;
  $('titulo').textContent = '🏆 ' + CFG.titulo;
  $('subtitulo').textContent = CFG.subtitulo + ' · Top ' + CFG.top;
}

function ponerQR(codigo){
  if (!codigo || codigo === codigoQR) return;
  codigoQR = codigo;
  const url = new URL('./', location.href);
  url.searchParams.set('c', codigo);
  $('qr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&data=' + encodeURIComponent(url.href);
}

function pintar(d){
  ponerQR(d.codigoEvento);
  const tb = $('filas');
  tb.innerHTML = '';
  $('vacio').classList.toggle('oculto', d.top.length > 0);
  const actuales = new Set();
  d.top.forEach((r, i) => {
    const k = r.nombre + '|' + r.puntos + '|' + r.segundos;
    actuales.add(k);
    const tr = document.createElement('tr');
    if (i === 0) tr.className = 'p1';
    if (anteriores.size && !anteriores.has(k)) tr.classList.add('nuevo');
    [i < 3 ? medallas[i] : (i + 1), r.nombre, r.aciertos + ' ✓ · ' + r.segundos + ' s', r.puntos + ' pts']
      .forEach((c, n) => {
        const td = document.createElement('td');
        if (n === 1) td.className = 'nombre';
        if (n === 2) td.className = 'det';
        td.textContent = c;
        tr.appendChild(td);
      });
    tb.appendChild(tr);
  });
  anteriores = actuales;
  $('jugadores').textContent = d.jugadores;
  $('hora').textContent = d.actualizado;
}

function pedirClave(msg){
  clearInterval(intervalo);
  $('panel').classList.add('oculto');
  $('login').classList.remove('oculto');
  $('errLogin').textContent = msg || '';
  $('clave').focus();
}

async function cargar(){
  try {
    pintar(await apiGet('ranking', { clave: clave }));
    try { localStorage.setItem(CLAVE_LS, clave); } catch (_) {}
    return true;
  } catch (e) {
    if (/clave/i.test(e.message)) {
      try { localStorage.removeItem(CLAVE_LS); } catch (_) {}
      pedirClave(e.message);
    } else {
      $('hora').textContent = 'sin conexión, reintentando…';
    }
    return false;
  }
}

function entrar(){
  if (!clave) { pedirClave(); return; }
  // Mostramos el panel y reintentamos periódicamente aunque falle la red;
  // si la clave es incorrecta, cargar() vuelve a la pantalla de clave.
  $('login').classList.add('oculto');
  $('panel').classList.remove('oculto');
  clearInterval(intervalo);
  intervalo = setInterval(cargar, CFG.refresco * 1000);
  cargar();
}

$('fLogin').addEventListener('submit', ev => {
  ev.preventDefault();
  clave = $('clave').value.trim();
  entrar();
});

apiGet('config')
  .then(c => { CFG = c; })
  .catch(() => {})
  .finally(() => { pintarCabecera(); entrar(); });
</script>
<style>.oculto{display:none}</style>
</body>
</html>
